services:
  postgres:
    image: postgres:16-alpine
    container_name: catax-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ca_tax_os
    ports:
      - "5433:5432"
    volumes:
      - catax-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
 
volumes:
  catax-pg-data: